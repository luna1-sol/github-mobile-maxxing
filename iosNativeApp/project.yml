# XcodeGen spec for the native SwiftUI app. iosNativeApp.xcodeproj is generated from this file and
# committed so that `xcodebuild -project iosNativeApp/iosNativeApp.xcodeproj ...` works without XcodeGen.
# Regenerate with: cd iosNativeApp && xcodegen generate
#
# Unlike iosApp (Compose Multiplatform host), this target is pure Swift/SwiftUI and does not invoke Gradle.
name: iosNativeApp
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
options:
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Everything runs on the main actor unless marked otherwise (Xcode 26 "Approachable Concurrency").
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  iosNativeApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iosNativeApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: iosNativeApp
        INFOPLIST_FILE: iosNativeApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: github-mobile-maxxing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: $(TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
  iosNativeAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iosNativeAppTests
    dependencies:
      - target: iosNativeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(TEAM_ID)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iosNativeApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosNativeApp
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  iosNativeApp:
    build:
      targets:
        iosNativeApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: iosNativeAppTests
    archive:
      config: Release
